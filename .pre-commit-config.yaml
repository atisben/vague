repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the ruff that `uv run ruff` resolves, so local and hook results agree
    rev: v0.15.15
    hooks:
      - id: ruff-check

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Two trailing spaces are a hard line break in markdown
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: vague-skill-check
        name: vague skill-check
        # Runs the whole repo check: a skill edit can break README.md or CLAUDE.md drift rules, and vice versa
        entry: uv run vague skill-check
        language: system
        pass_filenames: false
        files: ^(vague/assets/skills/|README\.md$|CLAUDE\.md$)
